; Repondeur guide : une annonce, puis quatre questions enregistrees une a une.
; A inclure dans /etc/asterisk/extensions.conf ; les appels entrants du
; trunk doivent arriver dans le contexte [repondeur].
;
; Record(fichier, silence, duree max, options)
;   silence   : secondes de silence qui valident la reponse
;   duree max : secondes au-dela desquelles on passe a la suite
;   k         : garde le fichier meme si l'appelant raccroche pendant

[repondeur]
exten => _X.,1,Goto(s,1)
exten => s,1,Answer()
 same => n,Set(NUM=${FILTER(0-9+,${CALLERID(num)})})
 same => n,Set(DOSSIER=/var/spool/repondeur/${STRFTIME(${EPOCH},,%Y%m%d-%H%M%S)}-${UNIQUEID})
 same => n,System(mkdir -p ${DOSSIER})
 same => n,Wait(1)
 same => n,Playback(repondeur/accueil)
 same => n,Playback(repondeur/q_nom)
 same => n,Record(${DOSSIER}/1_nom.wav,3,15,k)
 same => n,Playback(repondeur/q_motif)
 same => n,Record(${DOSSIER}/2_motif.wav,4,60,k)
 same => n,Playback(repondeur/q_praticien)
 same => n,Record(${DOSSIER}/3_praticien.wav,3,10,k)
 same => n,Playback(repondeur/q_rappel)
 same => n,Record(${DOSSIER}/4_rappel.wav,3,20,k)
 same => n,Playback(repondeur/merci)
 same => n,Hangup()

; Execute a la fin de l'appel, meme si l'appelant raccroche en cours de route :
; un message incomplet arrive quand meme dans le tableau.
exten => h,1,System(/opt/repondeur/traiter_message.py ${DOSSIER} ${NUM} >> /var/log/repondeur.log 2>&1 &)
